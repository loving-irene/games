<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#04121a">
<title>潮汐防线 · Tide Defense</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css?v=2.0">
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- 开始界面 -->
  <div id="screen-start" class="screen">
    <h1>潮汐防线</h1>
    <p class="subtitle">TIDE&nbsp;DEFENSE</p>
    <div id="pad-status">🎮 未检测到手柄 · 支持 PS5 / Xbox 手柄 · 也可用键盘 / 触屏</div>
    <div class="controls-help">
      <div class="ctl"><span class="key">A/D · ←/→ · 左摇杆 / D-pad</span><span>左右移动</span></div>
      <div class="ctl"><span class="key">自动射击</span><span>站左半边打左边 · 站右半边打右边</span></div>
      <div class="ctl"><span class="key">桥面道具</span><span>武器升级 · +N 士兵 · x2 翻倍</span></div>
      <div class="ctl"><span class="key">触屏拖动</span><span>移动队伍</span></div>
      <div class="ctl"><span class="key">Esc / P / OPTIONS</span><span>暂停</span></div>
    </div>
    <button id="btn-start" class="btn">开始防守</button>
    <p class="hint">按 空格 / ✕ 开始 · 士兵就是生命，别放敌人近身 · 接住桥上的道具箱</p>
  </div>

  <!-- 暂停 -->
  <div id="screen-pause" class="screen hidden">
    <h2>已暂停</h2>
    <p id="pause-info"></p>
    <button id="btn-resume" class="btn">继续 (Esc)</button>
    <button id="btn-pause-restart" class="btn btn-ghost">重新开始</button>
  </div>

  <!-- 结束 -->
  <div id="screen-over" class="screen hidden">
    <h2>防线失守</h2>
    <p id="final-stats"></p>
    <button id="btn-restart" class="btn">再来一局 (空格)</button>
  </div>

  <!-- 游戏中暂停按钮 -->
  <button id="btn-pause" class="hidden">⏸</button>
</div>
<script src="js/input.js?v=2.6"></script>
<script src="js/audio.js?v=2.6"></script>
<script src="js/entities.js?v=2.6"></script>
<script src="js/render.js?v=2.6"></script>
<script src="js/game.js?v=2.6"></script>
</body>
</html>
